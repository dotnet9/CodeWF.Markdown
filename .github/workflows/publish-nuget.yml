name: publish-nuget

# 推送 v* 格式 tag 时触发，例如 v12.1.2.12。
# 包版本号以 Directory.Build.props 的 <Version> 为准（打 tag 前先升版本），
# tag 只负责触发与命名 GitHub Release，不一致时仅告警不阻断。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # NuGet Trusted Publishing：用 OIDC 令牌换取一次性发布凭据

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          # 目标框架 net8.0 / net10.0 / net11.0 与 ci.yml 保持一致
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Check tag matches package version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:TAG.TrimStart('v')
          $props = Get-Content -LiteralPath Directory.Build.props -Raw -Encoding UTF8
          if ($props -match '<Version>([^<]+)</Version>') {
            $packageVersion = $Matches[1].Trim()
            if ($tagVersion -ne $packageVersion) {
              Write-Host "::warning::Tag ($tagVersion) 与 Directory.Build.props 的 Version ($packageVersion) 不一致，本次将以 $packageVersion 发布。"
            }
          } else {
            Write-Host "::warning::未在 Directory.Build.props 中找到 <Version>，将使用项目默认版本。"
          }

      - name: Build
        shell: pwsh
        run: |
          dotnet build CodeWF.Markdown.slnx -c Release
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Pack
        shell: pwsh
        run: |
          # 与 pack.bat 一致：只 pack 四个库项目，Sample 项目 IsPackable=false 不参与；
          # .NET 11 SDK 的 pack 不再隐式构建，须先 Build 再 --no-build Pack
          $projects = @(
            'src/CodeWF.Markdown/CodeWF.Markdown.csproj',
            'src/CodeWF.Markdown.Themes/CodeWF.Markdown.Themes.csproj',
            'src/CodeWF.Markdown.Highlighting/CodeWF.Markdown.Highlighting.csproj',
            'src/CodeWF.Markdown.Math/CodeWF.Markdown.Math.csproj',
            'src/CodeWF.Markdown.Mermaid/CodeWF.Markdown.Mermaid.csproj',
            'src/CodeWF.Markdown.Images/CodeWF.Markdown.Images.csproj',
            'src/CodeWF.Markdown.Export/CodeWF.Markdown.Export.csproj'
          )

          foreach ($project in $projects) {
            dotnet pack $project -c Release --no-build -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { throw "pack failed: $project" }
          }

          Get-ChildItem artifacts/packages | ForEach-Object { Write-Host $_.Name }

      - name: NuGet login (Trusted Publishing)
        uses: nuget/login@v1
        id: login
        with:
          user: dotnet9

      - name: Push to nuget.org
        shell: pwsh
        run: |
          # 主包：失败即中止
          Get-ChildItem artifacts/packages -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "push failed: $($_.Name)" }
          }

          # 符号包：不含 pdb 的 snupkg 会被 nuget.org 拒绝，仅告警不中止
          Get-ChildItem artifacts/packages -Filter *.snupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { Write-Host "warning: symbol package push failed: $($_.Name)" }
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
